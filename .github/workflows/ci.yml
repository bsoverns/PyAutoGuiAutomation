name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build
        run: python -m compileall -q src tests
      - name: Lint
        shell: bash
        run: ruff check . && ruff format --check .
      - name: Test
        run: python -m pytest
